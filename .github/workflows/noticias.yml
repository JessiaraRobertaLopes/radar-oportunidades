name: Radar - Notícias pré-edital

# Roda sozinho todo dia útil às 07h43 (Brasília) e também pelo botão "Run workflow".
# Custo: só a IA lendo manchetes (centavos por execução).
# Horário em UTC: 10 = 07h de Brasília.
# Evite minuto 0 ou 30: o GitHub atrasa ou descarta execuções nesses horários.
on:
  schedule:
    - cron: '43 10 * * 1-5'   # seg a sex, 07h43 de Brasília
  workflow_dispatch:

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Buscar e filtrar notícias
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python noticias.py
