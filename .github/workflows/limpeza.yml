name: Limpeza dos editais antigos (sem IA)

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Gravar no banco? "nao" só mostra o relatório; "sim" aplica a limpeza'
        required: true
        default: 'nao'

jobs:
  limpeza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Limpeza
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APLICAR: ${{ github.event.inputs.aplicar }}
        run: python limpeza.py
