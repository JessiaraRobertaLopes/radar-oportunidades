name: Radar de Oportunidades v2

# Roda sozinho toda segunda às 07h17 (Brasília) e também pelo botão "Run workflow".
# Custo aproximado: US$ 1,10 por execução (quase tudo da busca na web).
# Para mudar o dia/hora, troque o cron (horário em UTC: 10 = 07h de Brasília).
# Evite minuto 0 (hora cheia): o GitHub atrasa ou descarta execuções nesse horário.
on:
  schedule:
    - cron: '17 10 * * 1'   # segunda, 07h17 de Brasília
  workflow_dispatch:
    inputs:
      modo:
        description: 'normal = busca editais novos | releitura = relê os editais antigos do banco'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - releitura
      max_leituras:
        description: 'Máximo de editais lidos pela IA nesta execução (controla o custo)'
        required: true
        default: '25'

jobs:
  captar-e-qualificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Captar editais (descobrir, barrar repetidos e ler)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_LEITURAS: ${{ github.event.inputs.max_leituras || '25' }}   # semanal: lê até 25 editais novos
          MODO: ${{ github.event.inputs.modo || 'normal' }}
        run: python scraper.py

      - name: Qualificar editais novos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python qualifier.py
